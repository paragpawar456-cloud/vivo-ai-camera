name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          rm -f local.properties
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --console=plain > build.log 2>&1
          code=$?
          echo "===== ERROR SUMMARY ====="
          grep -E "^e: |What went wrong|error:|AAPT|Could not" -A4 build.log | head -150
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: ProLensAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK as the "latest" release (easy phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ProLensAI.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ProLensAI.apk --title "ProLens AI (latest build)" --notes "Install ProLensAI.apk on your phone (allow installs from unknown sources)."
